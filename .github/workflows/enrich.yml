name: Enrich Zootierliste display status

on:
  workflow_dispatch:
  schedule:
    # Daily at 14:17 UTC
    - cron: "17 14 * * *"

permissions:
  contents: write

concurrency:
  group: git-scrape-zootierliste
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enrich behind-the-scenes status
        run: |
          python enrich_behind_scenes.py \
            --holdings-dir holdings \
            --identities zoo_identities.csv \
            --cache species_display_status.json \
            --max-pages 2000 \
            --sleep 1.0

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holdings species_display_status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "Update display status: ${ts}"
          git push
